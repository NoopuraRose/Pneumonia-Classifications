<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pneumonia Classifier</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto flex min-h-screen max-w-5xl items-center px-5 py-12">
    <section class="grid w-full gap-8 lg:grid-cols-[1.1fr_0.9fr]">
      <div class="flex flex-col justify-center">
        <span class="mb-4 w-fit rounded-full border border-cyan-400/30 bg-cyan-400/10 px-3 py-1 text-sm text-cyan-300">YOLOv8 image classification</span>
        <h1 class="text-4xl font-bold tracking-tight sm:text-6xl">Chest X-ray<br><span class="text-cyan-300">insights, instantly.</span></h1>
        <p class="mt-5 max-w-xl text-lg leading-8 text-slate-400">Upload a chest X-ray and get a model prediction with confidence scores for NORMAL and PNEUMONIA.</p>
        <p class="mt-6 text-sm text-amber-300">Educational demo only — not a medical diagnosis.</p>
      </div>

      <div class="rounded-3xl border border-white/10 bg-white/[0.06] p-6 shadow-2xl backdrop-blur sm:p-8">
        <form id="prediction-form" class="space-y-5">
          <label for="image" class="group flex cursor-pointer flex-col items-center justify-center rounded-2xl border-2 border-dashed border-slate-600 px-6 py-10 text-center transition hover:border-cyan-400 hover:bg-cyan-400/5">
            <svg class="mb-4 h-10 w-10 text-cyan-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-8h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
            <span class="font-semibold">Choose an X-ray image</span>
            <span class="mt-1 text-sm text-slate-400">JPG, PNG, BMP, or WEBP · max 10 MB</span>
            <input id="image" name="image" type="file" accept="image/*" class="hidden" required>
          </label>
          <img id="preview" class="hidden max-h-64 w-full rounded-xl object-contain" alt="Selected X-ray preview">
          <button id="submit-button" type="submit" class="w-full rounded-xl bg-cyan-400 px-5 py-3 font-bold text-slate-950 transition hover:bg-cyan-300 disabled:cursor-not-allowed disabled:opacity-50">Analyze image</button>
        </form>

        <div id="status" class="mt-5 hidden rounded-xl p-4 text-sm"></div>
        <div id="result" class="mt-5 hidden rounded-2xl border border-cyan-400/20 bg-slate-900/70 p-5">
          <p class="text-sm uppercase tracking-widest text-slate-400">Prediction</p>
          <div class="mt-1 flex items-end justify-between gap-4"><h2 id="prediction" class="text-3xl font-bold text-cyan-300"></h2><span id="confidence" class="text-lg font-semibold"></span></div>
          <div id="probabilities" class="mt-5 space-y-3"></div>
        </div>
      </div>
    </section>
  </main>
  <script>
    const form = document.querySelector('#prediction-form');
    const input = document.querySelector('#image');
    const preview = document.querySelector('#preview');
    const button = document.querySelector('#submit-button');
    const status = document.querySelector('#status');
    const result = document.querySelector('#result');
    input.addEventListener('change', () => {
      const file = input.files[0];
      if (!file) return;
      preview.src = URL.createObjectURL(file);
      preview.classList.remove('hidden');
      result.classList.add('hidden');
    });
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!input.files[0]) return;
      button.disabled = true;
      button.textContent = 'Analyzing...';
      status.className = 'mt-5 rounded-xl bg-cyan-400/10 p-4 text-sm text-cyan-200';
      status.textContent = 'Running the model...';
      status.classList.remove('hidden');
      result.classList.add('hidden');
      try {
        const response = await fetch('/api/predict', { method: 'POST', body: new FormData(form) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Prediction failed.');
        document.querySelector('#prediction').textContent = data.prediction;
        document.querySelector('#confidence').textContent = `${(data.confidence * 100).toFixed(1)}% confidence`;
        document.querySelector('#probabilities').innerHTML = Object.entries(data.probabilities).map(([label, value]) => `
          <div><div class="mb-1 flex justify-between text-sm"><span>${label}</span><span>${(value * 100).toFixed(1)}%</span></div><div class="h-2 rounded-full bg-slate-700"><div class="h-2 rounded-full bg-cyan-400" style="width:${value * 100}%"></div></div></div>`).join('');
        result.classList.remove('hidden');
        status.className = 'mt-5 rounded-xl bg-emerald-400/10 p-4 text-sm text-emerald-300';
        status.textContent = 'Analysis complete.';
      } catch (error) {
        status.className = 'mt-5 rounded-xl bg-rose-400/10 p-4 text-sm text-rose-300';
        status.textContent = error.message;
      } finally {
        button.disabled = false;
        button.textContent = 'Analyze image';
      }
    });
  </script>
</body>
</html>
